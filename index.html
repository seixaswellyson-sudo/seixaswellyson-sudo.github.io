<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-book Premium - Venda</title>
    <style>
        /* Estilos Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Principal da Página de Vendas */
        .landing-page {
            max-width: 800px;
            width: 100%;
            text-align: center;
            padding: 40px 20px;
        }

        /* Cabeçalho / Chamada Principal (Headline) */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Sub-chamada */
        p.subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Botão de Chamada para Ação (CTA) */
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.6);
        }

        /* Rodapé Simples */
        footer {
            margin-top: 60px;
            font-size: 0.85rem;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="landing-page">
        <!-- Headline chamativa -->
        <h1>Descubra o Método Exato para Dominar Novas Habilidades em 30 Dias</h1>
        
        <!-- Sub-headline explicativa -->
        <p class="subtitle">O guia definitivo, prático e direto ao ponto para quem não tem tempo a perder e quer resultados reais ainda este mês.</p>
        
        <!-- Botão de Compra -->
        <a href="#" class="cta-button">Quero Garantir Meu Acesso</a>
    </div>

    <footer>
        <p>&copy; 2026 Seu Nome ou Sua Marca. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
